<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>AstroMedic AI</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--card:#101a2e;--card2:#16233f;--tx:#e8f0ff;--mut:#8fa3c7;--acc:#9be000;--ok:#3ddc97;--mon:#f5c542;--gr:#ff9f43;--em:#ff4d5e;--line:#22304f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent),radial-gradient(1px 1px at 70% 15%,#fff6 50%,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff7 50%,transparent),radial-gradient(1px 1px at 35% 80%,#fff5 50%,transparent),radial-gradient(circle at 50% -10%,#14305a 0,var(--bg) 60%);background-color:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:19px;margin:6px 0 10px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:15px;margin:8px 0;font:inherit;min-height:56px}
.btn:active{background:var(--card2)}.btn b{display:block}.btn small{color:var(--mut)}
.ico{font-size:24px}
.pri{background:var(--acc);color:#10200a;border:0;font-weight:700;justify-content:center;border-radius:14px;padding:15px;width:100%;font-size:17px;margin-top:14px}
.sec{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.sw{appearance:none;width:52px;height:30px;border-radius:15px;background:#2a3858;position:relative;flex:none}
.sw:checked{background:var(--acc)}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}.sw:checked::after{left:25px}
input[type=range]{width:100%;accent-color:var(--acc);height:32px}
.val{color:var(--acc);font-weight:700}
.badge{border-radius:16px;padding:18px;text-align:center;font-weight:800;font-size:22px;color:#0a0f1c}
.alert{background:#3a1018;border:1px solid var(--em);color:#ffd6da;border-radius:14px;padding:12px;margin:10px 0}
ol,ul{padding-left:22px;margin:6px 0}li{margin:6px 0}
textarea{width:100%;min-height:170px;background:#0b1424;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace}
.note{color:var(--mut);font-size:12px;margin-top:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#0b1324ee;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px)}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 18px}
nav button.on{color:var(--acc)}nav .ico{font-size:22px}
.q{display:flex;gap:8px;align-items:center}.q button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:20px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const LV=[{n:"Self-treat",c:"var(--ok)"},{n:"Monitor",c:"var(--mon)"},{n:"Contact ground",c:"var(--gr)"},{n:"Emergency",c:"var(--em)"}];
let kit=load("kit",{"Anti-nausea tablets":10,"Painkillers":6,"Antibiotics":8,"IV fluids":4,"Eye drops":5,"Thermometer":1,"Ultrasound":1,"Blood pressure cuff":1,"Bandages":20});
let log=load("log",[]);
let S={screen:"home",cond:null,flags:{},ans:{},res:null};

function mkR(){return{lvl:0,why:[],steps:[],up(l){if(l>this.lvl)this.lvl=l},set(l){this.lvl=l},w(t){this.why.push(t)},s(t){this.steps.push(t)},has(n){return(kit[n]||0)>0}}}

const C=[
{id:"ms",ico:"🤢",t:"Nausea or dizziness",s:"Space motion sickness",q:[
 {k:"day",l:"Days since symptoms started",t:"n",min:0,max:30,d:1},
 {k:"vom",l:"Times vomited in the last 24 hours",t:"n",min:0,max:20,d:0},
 {k:"fl",l:"Able to keep fluids down?",t:"y",d:true}],
 ev(a,R){R.w("Common in the first days (60–80% of astronauts).");
  R.s("Limit sudden head movements and rest in a stable position.");R.s("Sip water or an electrolyte drink slowly.");
  R.has("Anti-nausea tablets")?R.s("Use the on-board anti-nausea tablets per the kit protocol card."):R.s("No anti-nausea tablets left: contact ground.");
  if(a.vom>3||!a.fl){R.up(2);R.w("Repeated vomiting or unable to keep fluids down (dehydration risk).");if(R.has("IV fluids"))R.s("Prepare IV fluids only on ground instruction.")}
  else if(a.day>5){R.up(2);R.w("Symptoms lasting more than 5 days.")}
  else if(a.day>3){R.up(1);R.w("Symptoms lasting beyond the usual first days.")}}},
{id:"kd",ico:"🪨",t:"Side or back pain, urinary problem",s:"Kidney stone / UTI",q:[
 {k:"pain",l:"Pain severity",t:"n",min:0,max:10,d:0},
 {k:"flank",l:"Pain in side, back or lower abdomen?",t:"y"},
 {k:"blood",l:"Blood in urine?",t:"y"},
 {k:"burn",l:"Burning when urinating?",t:"y"},
 {k:"fever",l:"Fever or chills?",t:"y"},
 {k:"vom",l:"Nausea or vomiting?",t:"y"},
 {k:"relief",l:"Did on-board painkillers help? (leave on if not used)",t:"y",d:true}],
 ev(a,R){R.w("Kidney stones rank as a leading cause of emergency evacuation from the ISS.");
  R.s("Drink water steadily and record your fluid intake.");
  if(R.has("Painkillers"))R.s("Use on-board painkillers exactly per the kit protocol card.");else{R.s("No painkillers in the kit.");R.up(2)}
  if(R.has("Thermometer"))R.s("Check your temperature and log it.");
  if(a.flank&&R.has("Ultrasound"))R.s("Ground may request an ultrasound of the kidney area.");
  if(a.burn&&R.has("Antibiotics"))R.s("Antibiotics only on ground instruction.");
  if(a.flank&&a.pain>=4){R.up(1);R.w("Side or back pain of moderate severity.")}
  if(a.pain>=7||!a.relief||a.blood||a.vom){R.up(2);R.w("Severe pain, blood in urine, vomiting, or painkillers not working.")}
  if(a.fever&&(a.flank||a.pain>=5)){R.up(3);R.w("Fever with pain suggests a possible infection.")}}},
{id:"bc",ico:"🩸",t:"Swelling or pain in neck, arm or leg",s:"Possible blood clot",q:[
 {k:"site",l:"Swelling, redness or warmth in neck, arm or leg?",t:"y"},
 {k:"pain",l:"Pain severity in that area",t:"n",min:0,max:10,d:0},
 {k:"head",l:"New headache or facial swelling?",t:"y"}],
 ev(a,R){R.w("Clots can be silent (a 2020 ISS case had no symptoms).");R.set(2);
  R.s("Do not massage the area. Keep the patient calm.");
  if(R.has("Ultrasound"))R.s("Prepare the ultrasound; ground may guide a vein scan.");
  if(R.has("Blood pressure cuff"))R.s("Record blood pressure and pulse.");
  R.s("Blood thinners only on ground instruction.");
  if(a.site&&(a.pain>=6||a.head)){R.set(3);R.w("Swelling with severe pain or head and face symptoms.")}
  else if(!a.site&&a.pain<3&&!a.head){R.set(1);R.w("No local signs. A routine ultrasound check is advised.")}}},
{id:"sa",ico:"👁️",t:"Vision changes",s:"Vision changes (SANS)",q:[
 {k:"sudden",l:"Sudden vision loss or flashes?",t:"y"},
 {k:"blur",l:"Blurry near vision or focus change?",t:"y"},
 {k:"head",l:"Headache with the vision change?",t:"y"}],
 ev(a,R){R.w("Fluid shifts raise pressure toward the head (about 70% of long-mission crew show some change).");
  if(a.sudden){R.set(3);R.w("Sudden vision loss.");R.s("Protect the eyes, stop tasks and alert the crew.");return}
  R.set(1);R.s("Log the change daily with an eye chart check.");
  if(R.has("Eye drops"))R.s("Lubricating eye drops may ease dryness.");
  if(R.has("Ultrasound"))R.s("Ground may ask for an eye ultrasound.");
  if(a.blur&&a.head){R.set(2);R.w("Blur plus headache may indicate raised pressure.")}}},
{id:"sl",ico:"😴",t:"Sleep or mood",s:"Sleep / mental health",q:[
 {k:"days",l:"Days of poor sleep or low mood",t:"n",min:0,max:30,d:1},
 {k:"func",l:"Affecting your ability to work?",t:"y"}],
 ev(a,R){R.w("Isolation, confinement and stress raise the risk of anxiety and low morale.");
  R.set(a.days>2?1:0);R.s("Keep a fixed sleep schedule and dim lights before sleep.");
  R.s("Schedule exercise and a call with family or a crewmate.");
  if(a.days>=7||a.func){R.up(2);R.w("Lasting a week or more, or affecting duties.")}}},
{id:"il",ico:"🤒",t:"Fever or feeling ill",s:"Illness / immunity",q:[
 {k:"temp",l:"Temperature (°C)",t:"n",min:35,max:41,step:0.1,d:36.8},
 {k:"days",l:"Days of illness",t:"n",min:0,max:30,d:1},
 {k:"rash",l:"New rash or allergic reaction?",t:"y"}],
 ev(a,R){R.w("Stress hormones in space can weaken immunity.");
  R.s("Rest, drink fluids and isolate if possible.");
  if(R.has("Antibiotics"))R.s("Antibiotics only on ground instruction.");
  if(a.temp>=38||a.days>=3){R.up(1);R.w("Fever or illness lasting several days.")}
  if(a.temp>=39||a.days>=5||a.rash){R.up(2);R.w("High fever, long illness or rash.")}}}
];

function go(s){S.screen=s;render();window.scrollTo(0,0)}
function start(i){S.cond=C[i];S.flags={};S.ans={};S.cond.q.forEach(q=>S.ans[q.k]=q.d!==undefined?q.d:(q.t==="y"?false:0));go("safety")}

function finish(){
  const R=mkR(),c=S.cond;
  const f=S.flags;
  if(f.chest||f.breath||f.faint||f.harm){
    R.set(3);R.w("A red-flag symptom was reported (chest pain, breathing trouble, fainting or self-harm thoughts).");
    R.s("Alert the crew now and stay with the patient.");R.s("Open an emergency link to the ground flight surgeon.");
    R.s(f.harm?"Do not leave the person alone. Speak to a crew member or ground now.":"Keep the patient calm and secured. Monitor breathing and pulse.");
    S.res={R,cond:"Red-flag symptom"};
  }else{c.ev(S.ans,R);S.res={R,cond:c.s}}
  const ts=new Date();S.res.ts=ts;
  log.unshift({ts:ts.toISOString(),cond:S.res.cond,lvl:R.lvl});log=log.slice(0,50);store("log",log);
  go("result");
}

function report(){
  const{R,cond,ts}=S.res;
  const ans=S.cond&&!(S.flags.chest||S.flags.breath||S.flags.faint||S.flags.harm)?S.cond.q.map(q=>"- "+q.l+": "+(q.t==="y"?(S.ans[q.k]?"yes":"no"):S.ans[q.k])).join("\n"):"- Red-flag screening positive";
  return"GROUND LINK REPORT (prototype)\nTime: "+ts.toLocaleString()+"\nCondition: "+cond+"\nTriage: "+LV[R.lvl].n+"\nReason: "+R.why.join(" ")+"\n\nAnswers:\n"+ans+"\n\nSteps given:\n"+R.steps.map((s,i)=>(i+1)+". "+s).join("\n")+"\n\nNote: message round trip may take about 20 minutes. Keep the patient monitored.";
}

function copyReport(){const t=$("#rep");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}$("#cp").textContent="Copied ✓"}

function render(){
  const a=$("#app");let h="";
  if(S.screen==="home"){
    h=`<h1>🚀 AstroMedic AI</h1><div class="sub">Medical assistant for long space missions. Prototype, not a substitute for flight surgeon advice.</div><h2>What is the problem?</h2>`+
    C.map((c,i)=>`<button class="btn" onclick="start(${i})"><span class="ico">${c.ico}</span><span><b>${c.t}</b><small>${c.s}</small></span></button>`).join("");
  }
  if(S.screen==="safety"){
    const rows=[["chest","Chest pain or pressure?"],["breath","Difficulty breathing?"],["faint","Fainting or near-fainting?"],["harm","Thoughts of harming yourself?"]];
    h=`<h2>⚠️ Safety check</h2><div class="sub">Answer first. These always trigger an emergency.</div><div class="card">`+rows.map(r=>`<div class="row"><span>${r[1]}</span><input class="sw" type="checkbox" ${S.flags[r[0]]?"checked":""} onchange="S.flags['${r[0]}']=this.checked"></div>`).join("")+`</div><button class="pri" onclick="${"S.flags.chest||S.flags.breath||S.flags.faint||S.flags.harm?finish():go('form')"}">Continue</button>`;
  }
  if(S.screen==="form"){
    h=`<h2>${S.cond.ico} ${S.cond.s}</h2><div class="card">`+S.cond.q.map(q=>{
      if(q.t==="y")return`<div class="row"><span>${q.l}</span><input class="sw" type="checkbox" ${S.ans[q.k]?"checked":""} onchange="S.ans['${q.k}']=this.checked"></div>`;
      return`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${q.l}</span><span class="val" id="v_${q.k}">${S.ans[q.k]}</span></div><input type="range" min="${q.min}" max="${q.max}" step="${q.step||1}" value="${S.ans[q.k]}" oninput="S.ans['${q.k}']=parseFloat(this.value);$('#v_${q.k}').textContent=this.value"></div>`}).join("")+`</div><button class="pri" onclick="finish()">Get triage result</button>`;
  }
  if(S.screen==="result"){
    const{R,cond}=S.res,L=LV[R.lvl];
    h=`<div class="badge" style="background:${L.c}">${L.n.toUpperCase()}</div><div class="sub" style="margin-top:8px;text-align:center">${cond}</div>`+
    (R.lvl>=2?`<div class="alert">📡 <b>Contact Earth.</b> A ground report is ready below. Signal round trip may take about 20 minutes.</div>`:"")+
    `<div class="card"><b>Why</b><ul>${R.why.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="card"><b>First-aid steps (kit-aware)</b><ol>${R.steps.map(x=>`<li>${x}</li>`).join("")}</ol></div>`+
    (R.lvl>=2?`<div class="card"><b>Ground report</b><textarea id="rep" readonly>${report()}</textarea><button class="pri" id="cp" onclick="copyReport()">Copy report</button></div>`:"")+
    `<button class="sec" style="width:100%;margin-top:6px" onclick="go('home')">New check</button><div class="note">Prototype for demonstration. Not a substitute for flight surgeon advice.</div>`;
  }
  if(S.screen==="kit"){
    h=`<h2>🧰 On-board kit</h2><div class="sub">Steps only use items with quantity above zero. Set to 0 to simulate a shortage.</div><div class="card">`+Object.keys(kit).map(k=>`<div class="row"><span>${k}</span><span class="q"><button onclick="kitAdj('${k}',-1)">−</button><b id="k_${k.replace(/\W/g,"")}" style="min-width:26px;text-align:center">${kit[k]}</b><button onclick="kitAdj('${k}',1)">+</button></span></div>`).join("")+`</div>`;
  }
  if(S.screen==="log"){
    h=`<h2>📋 Symptom log</h2>`+(log.length?`<div class="card">`+log.map(e=>`<div class="row"><span><b>${e.cond}</b><br><small style="color:var(--mut)">${new Date(e.ts).toLocaleString()}</small></span><span style="color:${LV[e.lvl].c};font-weight:700;text-align:right">${LV[e.lvl].n}</span></div>`).join("")+`</div><button class="sec" onclick="log=[];store('log',log);render()">Clear log</button>`:`<div class="card" style="color:var(--mut)">No entries yet.</div>`);
  }
  a.innerHTML=h;
  const tab=["home","safety","form","result"].includes(S.screen)?"home":S.screen;
  $("#nav").innerHTML=[["home","🏠","Home"],["kit","🧰","Kit"],["log","📋","Log"]].map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')"><span class="ico">${t[1]}</span>${t[2]}</button>`).join("");
}
function kitAdj(k,d){kit[k]=Math.max(0,(kit[k]||0)+d);store("kit",kit);document.getElementById("k_"+k.replace(/\W/g,"")).textContent=kit[k]}
render();
</script>
</body>
</html>
